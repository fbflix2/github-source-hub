<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
     <link rel="icon" href="/favicon.ico" sizes="any" />
     <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
     <link rel="apple-touch-icon" href="/favicon.png" sizes="180x180" />
     <link rel="mask-icon" href="/favicon.png" color="#000000" />
     <meta name="msapplication-TileImage" content="/favicon.png" />
     <meta name="msapplication-TileColor" content="#000000" />
     <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBFLIX  -  Lider em  contigência</title>
    <meta name="description" content="Plataforma líder em  ativos para anúnciantes com mais de 3.500 clientes. Pagamento seguro , entrega automática e garantia.">
    <meta name="author" content="FBFLIX" />
    <link rel="canonical" href="https://fbflix.com.br" />
    <script>
      // Em domínios customizados de revendedores, remove o branding FBFlix
      // imediatamente (título, favicon, meta) antes de qualquer render, para
      // não vazar identidade visual da FBFlix na aba/preview.
      (function () {
        try {
          var h = (location.hostname || "").toLowerCase();
          var MAIN = ["fbflix.com.br","www.fbflix.com.br","fbflix1.lovable.app","localhost"];
          var isMain = MAIN.indexOf(h) !== -1 || /\.lovableproject\.com$/.test(h) || /\.lovable\.app$/.test(h);
          if (!isMain) {
            document.title = " ";
            var sels = ['link[rel="icon"]','link[rel="shortcut icon"]','link[rel="apple-touch-icon"]','link[rel="mask-icon"]'];
            sels.forEach(function (s) {
              document.querySelectorAll(s).forEach(function (el) { el.parentNode && el.parentNode.removeChild(el); });
            });
            document.documentElement.setAttribute("data-custom-domain","1");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical fonts: preload Inter & Space Grotesk via media="print" swap trick -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" /></noscript>

    <!-- Non-critical fonts: defer loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Satisfy&family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Satisfy&family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Material Symbols: defer -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" /></noscript>
